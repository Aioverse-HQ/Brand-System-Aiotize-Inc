name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-tokens:
    name: Lint & validate tokens
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tokens/package-lock.json

      - name: Install token build dependencies
        working-directory: tokens
        run: npm ci

      - name: Validate token JSON
        working-directory: tokens
        run: npm run lint

      - name: Build tokens
        working-directory: tokens
        run: npm run build

      - name: Verify build output is up-to-date
        run: |
          if [ -n "$(git status --porcelain tokens/build)" ]; then
            echo "tokens/build is out of date. Run 'npm run build' inside tokens/ and commit the result."
            git diff tokens/build
            exit 1
          fi

  lint-docs:
    name: Lint documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: markdownlint "**/*.md" --ignore node_modules --ignore "tokens/build/**"

  lint-web-package:
    name: Lint & build web package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        working-directory: packages/web
        run: npm ci

      - name: Lint
        working-directory: packages/web
        run: npm run lint

      - name: Build
        working-directory: packages/web
        run: npm run build
